<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      margin: 0;
      padding: 16px;
      color: #1f2328;
      background: #ffffff;
    }
    h3 { margin-top: 0; margin-bottom: 8px; font-size: 14px; font-weight: 600; }
    p { margin-top: 0; margin-bottom: 12px; color: #57606a; font-size: 12px; }
    .field { margin-bottom: 12px; }
    label { display: block; font-weight: 500; margin-bottom: 4px; font-size: 12px; }
    input, select {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      font-size: 13px;
    }
    button {
      width: 100%;
      background: #0969da;
      color: white;
      border: none;
      padding: 9px 12px;
      border-radius: 6px;
      font-weight: 500;
      cursor: pointer;
      font-size: 13px;
      margin-top: 8px;
    }
    button:hover { background: #085cc1; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .status {
      margin-top: 12px;
      font-size: 12px;
      color: #57606a;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h3>Design Change Log Notes</h3>
  <p>Fetches recent Jira changelog output and places note frames directly below updated screens.</p>

  <div class="field">
    <label for="serverUrl">Notifier Server URL</label>
    <input type="text" id="serverUrl" value="http://localhost:3000" />
  </div>

  <button id="btnFetch">Insert Change Notes</button>
  <div id="status" class="status"></div>

  <script>
    document.getElementById('btnFetch').addEventListener('click', async () => {
      const btn = document.getElementById('btnFetch');
      const status = document.getElementById('status');
      const serverUrl = document.getElementById('serverUrl').value.trim().replace(/\/$/, '');

      btn.disabled = true;
      status.textContent = 'Connecting to server...';

      try {
        const res = await fetch(`${serverUrl}/api/plugin/latest-changes`);
        if (!res.ok) throw new Error(`HTTP ${res.status}: Failed to fetch changes`);
        const data = await res.json();

        if (!data.projects || data.projects.length === 0) {
          status.textContent = 'No recent project changes found from server.';
          btn.disabled = false;
          return;
        }

        // Post all found frame changes to Figma plugin code
        for (const proj of data.projects) {
          parent.postMessage({
            pluginMessage: {
              type: 'apply-changes',
              changes: proj.screenChanges,
              runDate: proj.runDate || new Date().toISOString().split('T')[0],
              jiraIssueKey: proj.jiraIssueKey
            }
          }, '*');
        }

        status.textContent = `Applied change notes across ${data.projects.length} project(s).`;
      } catch (err) {
        status.textContent = `Error: ${err.message}`;
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
