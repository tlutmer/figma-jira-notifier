<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Figma → Jira Notifier</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #ffffff;
      --surface: #f4f4f4;
      --border: #e0e0e0;
      --text: #161616;
      --muted: #525252;
      --accent: #0f62fe;
      --danger: #da1e28;
      --success: #198038;
      --radius: 4px;
      --font: -apple-system, "Segoe UI", system-ui, sans-serif;
    }

    body {
      font-family: var(--font);
      font-size: 14px;
      line-height: 1.5;
      color: var(--text);
      background: var(--bg);
    }

    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    code { font-family: "SFMono-Regular", "Consolas", monospace; font-size: 0.875em; }

    /* ── Header ── */
    .app-header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .app-header-left h1 { font-size: 15px; font-weight: 700; }
    .app-header-left .subtitle { font-size: 12px; color: var(--muted); margin-top: 1px; }
    .app-header-right { display: flex; align-items: center; gap: 10px; }

    /* ── Main ── */
    .main { max-width: 900px; margin: 0 auto; padding: 28px 24px 64px; }

    /* ── Status bar ── */
    .status-bar {
      font-size: 12px;
      color: var(--muted);
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      background: var(--surface);
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 20px;
    }
    .status-bar strong { color: var(--text); }

    /* ── Section ── */
    .section { border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 24px; }
    .section-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 13px 18px; border-bottom: 1px solid var(--border);
      background: var(--surface); border-radius: var(--radius) var(--radius) 0 0;
    }
    .section-header h2 { font-size: 13px; font-weight: 600; }
    .section-body { padding: 18px; }

    /* ── Buttons ── */
    button {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 7px 14px; border-radius: var(--radius); border: 1px solid transparent;
      font-size: 13px; font-family: var(--font); font-weight: 500; cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary  { background: var(--accent); color: #fff; border-color: var(--accent); }
    .btn-primary:hover:not(:disabled)  { opacity: 0.88; }
    .btn-secondary { background: var(--surface); color: var(--text); border-color: var(--border); }
    .btn-secondary:hover:not(:disabled) { background: var(--border); }
    .btn-danger   { background: var(--bg); color: var(--danger); border-color: var(--danger); }
    .btn-danger:hover:not(:disabled)  { background: #fff1f1; }
    .btn-run {
      background: var(--success); color: #fff; border-color: var(--success);
      font-size: 14px; padding: 9px 20px;
    }
    .btn-run:hover:not(:disabled) { opacity: 0.88; }
    .btn-run.running { background: var(--muted); border-color: var(--muted); }

    /* ── Forms ── */
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .form-grid.full { grid-template-columns: 1fr; }
    .field { display: flex; flex-direction: column; gap: 4px; }
    .field label { font-size: 12px; font-weight: 500; color: var(--muted); }
    .field input {
      padding: 7px 10px; border: 1px solid var(--border); border-radius: var(--radius);
      font-size: 13px; font-family: var(--font); background: var(--bg); color: var(--text); width: 100%;
    }
    .field input:focus { outline: none; border-color: var(--accent); }

    /* ── Project list ── */
    .project-list { display: flex; flex-direction: column; gap: 10px; }
    .project-card {
      border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px;
      display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
    }
    .project-card-info { flex: 1; min-width: 0; }
    .project-card-info .name { font-weight: 600; font-size: 14px; }
    .project-card-info .meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .project-card-info .mentions { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .project-card-actions { display: flex; gap: 8px; flex-shrink: 0; }
    .empty-state { text-align: center; padding: 32px 16px; color: var(--muted); font-size: 13px; }

    /* ── Mention rows ── */
    .mention-row { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; align-items: end; margin-bottom: 8px; }
    .mention-row input { padding: 7px 10px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 13px; font-family: var(--font); }

    /* ── Run results ── */
    .run-results { margin-bottom: 20px; display: flex; flex-direction: column; gap: 8px; }
    .result-row {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 14px; border-radius: var(--radius); border: 1px solid var(--border); font-size: 13px;
    }
    .result-row.posted    { border-color: #a6f4bc; background: #defbe6; }
    .result-row.no_changes{ border-color: var(--border); background: var(--surface); }
    .result-row.first_run { border-color: #a2c0fd; background: #edf5ff; }
    .result-row.error     { border-color: #ffa9a9; background: #fff1f1; }
    .result-icon { font-size: 16px; }
    .result-detail { color: var(--muted); font-size: 12px; }

    /* ── Alerts ── */
    .alert { padding: 10px 14px; border-radius: var(--radius); font-size: 13px; margin-bottom: 14px; display: none; }
    .alert.show { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .alert-success { background: #defbe6; border: 1px solid #42be65; color: var(--success); }
    .alert-error   { background: #fff1f1; border: 1px solid #fa4d56; color: var(--danger); }
    .alert-dismiss { background: none; border: none; cursor: pointer; font-size: 15px; padding: 0 2px; color: inherit; line-height: 1; }

    /* ── Modal ── */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.4);
      display: none; align-items: center; justify-content: center; z-index: 100;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: var(--bg); border-radius: var(--radius); border: 1px solid var(--border);
      width: 560px; max-width: 95vw; max-height: 90vh; overflow-y: auto;
      box-shadow: 0 8px 32px rgba(0,0,0,0.14);
    }
    .modal-header {
      padding: 16px 20px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .modal-header h3 { font-size: 15px; font-weight: 600; }
    .modal-close { background: none; border: none; font-size: 18px; cursor: pointer; color: var(--muted); padding: 0 4px; }
    .modal-body { padding: 20px; display: flex; flex-direction: column; gap: 14px; }
    .modal-footer {
      padding: 14px 20px; border-top: 1px solid var(--border);
      display: flex; justify-content: flex-end; gap: 10px;
    }
    .divider { border: none; border-top: 1px solid var(--border); margin: 4px 0; }
    .label-row { display: flex; align-items: center; justify-content: space-between; }
    .label-row span { font-size: 12px; font-weight: 500; color: var(--muted); }

    /* ── GitHub link ── */
    .gh-link { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 5px; }
    .gh-link:hover { color: var(--text); text-decoration: none; }

    @media (max-width: 600px) {
      .form-grid { grid-template-columns: 1fr; }
      .app-header { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>

<!-- ═══════════════════ Header ═══════════════════ -->
<header class="app-header">
  <div class="app-header-left">
    <h1>📐 Figma → Jira Notifier</h1>

      <svg height="16" viewBox="0 0 16 16" width="16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>

<main class="main">

  <!-- ── Status bar ── -->

    <span>Last run: <strong id="lastRun">—</strong></span>
    <span>Next scheduled: <strong id="nextRun">Daily at 08:00</strong></span>

  <div class="section">

<!-- ═══════════════════ Add / Edit Project Modal ═══════════════════ -->
<div class="modal-backdrop" id="projectModal">

<script>
'use strict';

/* ── Storage ── */
const STORAGE_KEY = 'figma-changelog-config';
const SNAPSHOTS_KEY_PREFIX = 'figma-snapshot-';
const LAST_RUN_KEY = 'figma-last-run';

function loadConfig() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : defaultConfig();
  } catch { return defaultConfig(); }
}

function defaultConfig() {
  return { projects: [], schedule: '0 8 * * *', jiraBaseUrl: '', jiraEmail: '', figmaToken: '', jiraApiToken: '' };
}

function saveConfig(cfg) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(cfg));
}

function getStoredSnapshot(fileKey) {
  try {
    const raw = localStorage.getItem(SNAPSHOTS_KEY_PREFIX + fileKey);
    return raw ? JSON.parse(raw) : null;
  } catch { return null; }
}

function saveStoredSnapshot(fileKey, snapshot) {
  try {
    localStorage.setItem(SNAPSHOTS_KEY_PREFIX + fileKey, JSON.stringify(snapshot));
  } catch (e) {
    console.warn('Failed to save snapshot to localStorage:', e);
  }
}

/* ── Parsers ── */
function parseFigmaInput(input) {
  const trimmed = input.trim();
  const match = trimmed.match(/figma\.com\/(?:design|file)\/([A-Za-z0-9]+)(?:\/([^?#]*))?/);
  if (!match) return { fileKey: trimmed, figmaUrl: '', displayName: '' };
  const fileKey = match[1];
  const displayName = match[2] ? decodeURIComponent(match[2]).replace(/-/g, ' ').trim() : '';
  const figmaUrl = trimmed.startsWith('http') ? trimmed.split('?')[0] : `https://www.figma.com/design/${fileKey}`;
  return { fileKey, figmaUrl, displayName };
}

function parseJiraInput(input) {
  const match = input.trim().match(/\/browse\/([A-Z][A-Z0-9_]+-\d+)/);
  return { issueKey: match ? match[1] : input.trim() };
}

function uuid() {
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0;
    return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
  });
}

function esc(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function formatDate(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleString();
}

function describeSchedule(cron) {
  if (!cron) return '—';
  const parts = cron.trim().split(/\s+/);
  if (parts.length !== 5) return cron;
  const [min, hour, dom, , dow] = parts;
  if (dom === '*' && dow === '*') return `Daily at ${hour.padStart(2,'0')}:${min.padStart(2,'0')}`;
  return cron;
}

/* ── Alert helper ── */
function showAlert(elId, type, message) {
  const el = document.getElementById(elId);
  el.className = `alert alert-${type} show`;
  el.innerHTML = `<span>${esc(message)}</span><button class="alert-dismiss" onclick="dismissAlert('${elId}')">✕</button>`;
  if (type === 'success') setTimeout(() => dismissAlert(elId), 3500);
}
function dismissAlert(elId) {
  const el = document.getElementById(elId);
  if (el) el.className = 'alert';
}

/* ── State ── */
let config = loadConfig();
let editingProjectId = null;
let lastRunTime = localStorage.getItem(LAST_RUN_KEY) || null;

/* ── Diff Engine (browser-adapted) ── */
const TRACKED_TYPES = new Set([
  'FRAME', 'GROUP', 'COMPONENT', 'COMPONENT_SET',
  'INSTANCE', 'TEXT', 'RECTANGLE', 'ELLIPSE',
  'VECTOR', 'BOOLEAN_OPERATION', 'SECTION'
]);

function flattenTree(node, pageName = '', frameName = '', result = new Map()) {
  const currentPage = node.type === 'CANVAS' ? node.name : pageName;
  const currentFrame = (node.type === 'FRAME' || node.type === 'SECTION') && pageName !== ''
    ? node.name
    : frameName;

  if (TRACKED_TYPES.has(node.type)) {
    result.set(node.id, { node, pageName: currentPage, frameName: currentFrame });
  }

  if (Array.isArray(node.children)) {
    for (const child of node.children) {
      flattenTree(child, currentPage, currentFrame, result);
    }
  }

  return result;
}

function describeChanges(oldNode, newNode) {
  const changes = [];
  if (oldNode.characters !== newNode.characters) {
    changes.push(`text updated: ${oldNode.characters || '(empty)'} → ${newNode.characters || '(empty)'}`);
  }
  if (oldNode.name !== newNode.name) {
    changes.push(`renamed: "${oldNode.name}" → "${newNode.name}"`);
  }
  if (oldNode.visible !== newNode.visible) {
    changes.push(`layer ${newNode.visible === false ? 'hidden' : 'made visible'}`);
  }
  if (JSON.stringify(oldNode.fills) !== JSON.stringify(newNode.fills)) {
    const hadStyle = oldNode.styles && oldNode.styles.fill;
    const hasStyle = newNode.styles && newNode.styles.fill;
    changes.push(hadStyle && !hasStyle ? 'fill colour changed; style reference removed' : 'fill colour changed');
  }
  if (JSON.stringify(oldNode.styles) !== JSON.stringify(newNode.styles)) {
    if (JSON.stringify(oldNode.fills) === JSON.stringify(newNode.fills)) {
      changes.push('style reference changed');
    }
  }
  return changes;
}

function diffTrees(oldTree, newTree) {
  const newMap = flattenTree(newTree);
  const oldMap = oldTree ? flattenTree(oldTree) : new Map();

  const added = [];
  const removed = [];
  const updated = [];
  const pageSet = new Set();

  for (const [id, { node: newNode, pageName, frameName }] of newMap) {
    if (!oldMap.has(id)) {
      added.push({ id, name: newNode.name, type: newNode.type, pageName, frameName });
      pageSet.add(pageName);
    } else {
      const { node: oldNode } = oldMap.get(id);
      const changes = describeChanges(oldNode, newNode);
      if (changes.length > 0) {
        updated.push({ id, name: newNode.name, type: newNode.type, pageName, frameName, changes });
        pageSet.add(pageName);
      }
    }
  }

  for (const [id, { node: oldNode, pageName, frameName }] of oldMap) {
    if (!newMap.has(id)) {
      removed.push({ id, name: oldNode.name, type: oldNode.type, pageName, frameName });
      pageSet.add(pageName);
    }
  }

  return {
    added,
    removed,
    updated,
    totalChanges: added.length + removed.length + updated.length,
    pages: [...pageSet].filter(Boolean)
  };
}

function typeLabel(type) {
  const map = {
    FRAME: 'Frame', GROUP: 'Group', COMPONENT: 'Component',
    COMPONENT_SET: 'Component set', INSTANCE: 'Instance',
    TEXT: 'Text', RECTANGLE: 'Rectangle', ELLIPSE: 'Ellipse',
    VECTOR: 'Vector', BOOLEAN_OPERATION: 'Boolean op', SECTION: 'Section'
  };
  return map[type] || type;
}

function partitionSweeping(entries, threshold = 3) {
  const changeCount = new Map();
  for (const entry of entries) {
    for (const c of (entry.changes || [])) {
      changeCount.set(c, (changeCount.get(c) || 0) + 1);
    }
  }
  const sweepingDescs = new Set(
    [...changeCount.entries()].filter(([, n]) => n >= threshold).map(([d]) => d)
  );

  const restEntries = entries.map(entry => ({
    ...entry,
    changes: (entry.changes || []).filter(c => !sweepingDescs.has(c))
  })).filter(e => e.changes.length > 0);

  return { sweepingDescs, restEntries };
}

function buildCommentAdf(diffResult, figmaFileName, figmaUrl, runAt, mentionedUsers, snapshotDate) {
  const { added, removed, updated, totalChanges, pages } = diffResult;
  const pagesLabel = pages.length > 0 ? pages.join(', ') : 'Unknown';

  const adfContent = [
    { type: 'paragraph', content: [{ type: 'text', text: '📐 Figma Changelog — ' }, { type: 'text', text: `${totalChanges} Changes`, marks: [{ type: 'strong' }] }] },
    {
      type: 'paragraph',
      content: [
        { type: 'text', text: 'File: ', marks: [{ type: 'strong' }] },
        figmaUrl ? { type: 'text', text: figmaFileName, marks: [{ type: 'link', attrs: { href: figmaUrl } }] } : { type: 'text', text: figmaFileName }
      ]
    },
    { type: 'paragraph', content: [{ type: 'text', text: 'Pages: ', marks: [{ type: 'strong' }] }, { type: 'text', text: pagesLabel }] },
  ];

  if (!snapshotDate) {
    adfContent.push({ type: 'paragraph', content: [{ type: 'text', text: '⚠️ No previous snapshot found. This is the first run — baseline saved, no diff to report.' }] });
  }

  adfContent.push({ type: 'rule' });

  // Page sections
  const allPages = new Set([
    ...added.map(n => n.pageName || 'Unknown page'),
    ...removed.map(n => n.pageName || 'Unknown page'),
    ...updated.map(n => n.pageName || 'Unknown page'),
  ]);

  for (const page of allPages) {
    const pageAdded = added.filter(n => (n.pageName || 'Unknown page') === page);
    const pageRemoved = removed.filter(n => (n.pageName || 'Unknown page') === page);
    const pageUpdated = updated.filter(n => (n.pageName || 'Unknown page') === page);

    adfContent.push({ type: 'heading', attrs: { level: 3 }, content: [{ type: 'text', text: page }] });

    const { sweepingDescs, restEntries: localUpdated } = partitionSweeping(pageUpdated);

    if (sweepingDescs.size > 0 || pageAdded.length > 0 || pageRemoved.length > 0) {
      const noFrameAdded = pageAdded.filter(n => !n.frameName);
      const noFrameRemoved = pageRemoved.filter(n => !n.frameName);
      const sweepingBullets = [];

      if (noFrameAdded.length > 0) {
        sweepingBullets.push([{ type: 'text', text: 'Added', marks: [{ type: 'strong' }] }]);
        for (const n of [...new Map(noFrameAdded.map(x => [x.id, x])).values()]) {
          sweepingBullets.push([{ type: 'text', text: `${typeLabel(n.type)}: ${n.name}` }]);
        }
      }
      if (noFrameRemoved.length > 0) {
        sweepingBullets.push([{ type: 'text', text: 'Removed', marks: [{ type: 'strong' }] }]);
        for (const n of [...new Map(noFrameRemoved.map(x => [x.id, x])).values()]) {
          sweepingBullets.push([{ type: 'text', text: `${typeLabel(n.type)}: ${n.name}` }]);
        }
      }
      if (sweepingDescs.size > 0) {
        const sweepNodes = pageUpdated.filter(e => (e.changes || []).some(c => sweepingDescs.has(c)))
          .map(e => ({ ...e, changes: (e.changes || []).filter(c => sweepingDescs.has(c)) }));
        sweepingBullets.push([{ type: 'text', text: 'Updated', marks: [{ type: 'strong' }] }]);
        for (const node of sweepNodes) {
          for (const change of (node.changes || [])) {
            sweepingBullets.push([{ type: 'text', text: `${typeLabel(node.type)}: ${node.name} — ${change}` }]);
          }
        }
      }

      if (sweepingBullets.length > 0) {
        adfContent.push({ type: 'paragraph', content: [{ type: 'text', text: '⚡ Sweeping changes', marks: [{ type: 'strong' }] }] });
        adfContent.push({
          type: 'bulletList',
          content: sweepingBullets.map(b => ({ type: 'listItem', content: [{ type: 'paragraph', content: b }] }))
        });
      }
    }

    const frameNames = new Set([
      ...pageAdded.filter(n => n.frameName).map(n => n.frameName),
      ...pageRemoved.filter(n => n.frameName).map(n => n.frameName),
      ...localUpdated.filter(n => n.frameName).map(n => n.frameName),
    ]);

    for (const frame of frameNames) {
      const frameAdded = pageAdded.filter(n => n.frameName === frame);
      const frameRemoved = pageRemoved.filter(n => n.frameName === frame);
      const frameUpdated = localUpdated.filter(n => n.frameName === frame);

      adfContent.push({ type: 'paragraph', content: [{ type: 'text', text: `Screen: ${frame}`, marks: [{ type: 'strong' }] }] });

      const bullets = [];
      if (frameAdded.length > 0) {
        bullets.push([{ type: 'text', text: 'Added', marks: [{ type: 'strong' }] }]);
        for (const n of [...new Map(frameAdded.map(x => [x.id, x])).values()]) {
          bullets.push([{ type: 'text', text: `${typeLabel(n.type)}: ${n.name}` }]);
        }
      }
      if (frameRemoved.length > 0) {
        bullets.push([{ type: 'text', text: 'Removed', marks: [{ type: 'strong' }] }]);
        for (const n of [...new Map(frameRemoved.map(x => [x.id, x])).values()]) {
          bullets.push([{ type: 'text', text: `${typeLabel(n.type)}: ${n.name}` }]);
        }
      }
      if (frameUpdated.length > 0) {
        bullets.push([{ type: 'text', text: 'Updated', marks: [{ type: 'strong' }] }]);
        for (const node of frameUpdated) {
          for (const change of (node.changes || [])) {
            bullets.push([{ type: 'text', text: `${typeLabel(node.type)}: ${node.name} — ${change}` }]);
          }
        }
      }

      if (bullets.length > 0) {
        adfContent.push({
          type: 'bulletList',
          content: bullets.map(b => ({ type: 'listItem', content: [{ type: 'paragraph', content: b }] }))
        });
      }
    }

    adfContent.push({ type: 'rule' });
  }

  const mentionNodes = (mentionedUsers || []).flatMap(u => [
    { type: 'mention', attrs: { id: u.jiraAccountId, text: `@${u.displayName}` } },
    { type: 'text', text: ' ' }
  ]);

  if (mentionNodes.length > 0) {
    adfContent.push({
      type: 'paragraph',
      content: [{ type: 'text', text: 'Notifying: ', marks: [{ type: 'strong' }] }, ...mentionNodes]
    });
  }

  return { version: 1, type: 'doc', content: adfContent };
}

/* ── Runner Pipeline (Works with local API or direct browser fetch) ── */
async function runAllProjectsPipeline() {
  // If served from backend server, use backend /api/run
  try {
    const res = await fetch('/api/run', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({})
    });
    if (res.ok) {
      const data = await res.json();
      return data.results || [];
    }
  } catch {
    // Fall back to client-side run
  }

  // Client-side run using tokens stored in localStorage
  const projects = config.projects || [];
  if (projects.length === 0) return [];

  if (!config.figmaToken) {
    throw new Error('Figma personal access token is required to run.');
  }

  const results = [];
  for (const project of projects) {
    try {
      const res = await fetch(`https://api.figma.com/v1/files/${project.figmaFileKey}`, {
        headers: { 'X-Figma-Token': config.figmaToken }
      });
      if (!res.ok) {
        throw new Error(`Figma API error (${res.status}): ${await res.text()}`);
      }
      const data = await res.json();
      const currentTree = data.document;
      const previousSnapshot = getStoredSnapshot(project.figmaFileKey);

      if (!previousSnapshot) {
        currentTree._savedAt = new Date().toISOString();
        saveStoredSnapshot(project.figmaFileKey, currentTree);
        results.push({
          projectId: project.id,
          figmaFileName: project.figmaFileName || project.figmaFileKey,
          status: 'first_run',
          changesCount: 0
        });
        continue;
      }

      const diffResult = diffTrees(previousSnapshot, currentTree);
      if (diffResult.totalChanges === 0) {
        results.push({
          projectId: project.id,
          figmaFileName: project.figmaFileName || project.figmaFileKey,
          status: 'no_changes',
          changesCount: 0
        });
        continue;
      }

      const runAt = new Date().toISOString();
      const snapshotDate = previousSnapshot._savedAt || null;
      const adf = buildCommentAdf(
        diffResult,
        project.figmaFileName || project.figmaFileKey,
        project.figmaUrl || '',
        runAt,
        project.mentionedUsers || [],
        snapshotDate
      );

      // Post to Jira if configured
      if (config.jiraBaseUrl && config.jiraEmail && config.jiraApiToken && project.jiraIssueKey) {
        const jiraRes = await fetch(`${config.jiraBaseUrl.replace(/\/$/, '')}/rest/api/3/issue/${project.jiraIssueKey}/comment`, {
          method: 'POST',
          headers: {
            'Authorization': 'Basic ' + btoa(`${config.jiraEmail}:${config.jiraApiToken}`),
            'Content-Type': 'application/json',
            'Accept': 'application/json'
          },
          body: JSON.stringify({ body: adf })
        });
        if (!jiraRes.ok) {
          throw new Error(`Jira API error (${jiraRes.status}): ${await jiraRes.text()}`);
        }
      }

      currentTree._savedAt = runAt;
      saveStoredSnapshot(project.figmaFileKey, currentTree);

      results.push({
        projectId: project.id,
        figmaFileName: project.figmaFileName || project.figmaFileKey,
        status: 'posted',
        changesCount: diffResult.totalChanges
      });
    } catch (err) {
      results.push({
        projectId: project.id,
        figmaFileName: project.figmaFileName || project.figmaFileKey,
        status: 'error',
        changesCount: 0,
        error: err.message
      });
    }
  }

  return results;
}

/* ── Automatic Schedule Runner (Browser timer for 8:00am) ── */
let scheduleTimer = null;

function setupScheduleTimer() {
  if (scheduleTimer) clearTimeout(scheduleTimer);

  const parts = (config.schedule || '0 8 * * *').trim().split(/\s+/);
  const targetMinute = parseInt(parts[0] || '0', 10);
  const targetHour = parseInt(parts[1] || '8', 10);

  const now = new Date();
  const nextTarget = new Date();
  nextTarget.setHours(targetHour, targetMinute, 0, 0);

  if (nextTarget <= now) {
    nextTarget.setDate(nextTarget.getDate() + 1);
  }

  const msUntilTarget = nextTarget.getTime() - now.getTime();
  console.log(`[Scheduler] Automatic run scheduled in ${(msUntilTarget / 1000 / 60).toFixed(1)} minutes (at ${nextTarget.toLocaleTimeString()})`);

  scheduleTimer = setTimeout(async () => {
    console.log('[Scheduler] Executing scheduled automatic run at ' + new Date().toISOString());
    await executeRun(true);
    setupScheduleTimer();
  }, msUntilTarget);
}

async function executeRun(isAutomatic = false) {
  const btn = document.getElementById('btnRunNow');
  btn.disabled = true;
  btn.classList.add('running');
  btn.textContent = isAutomatic ? '⏳ Auto-running…' : '⏳ Running…';

  const resultsEl = document.getElementById('runResults');
  resultsEl.style.display = 'none';
  resultsEl.innerHTML = '';

  try {
    const results = await runAllProjectsPipeline();
    lastRunTime = new Date().toISOString();
    localStorage.setItem(LAST_RUN_KEY, lastRunTime);
    renderRunResults(results);
    updateStatusBar();
  } catch (err) {
    resultsEl.style.display = 'flex';
    resultsEl.innerHTML = `<div class="result-row error"><span class="result-icon">❌</span><span>${esc(err.message)}</span></div>`;
  } finally {
    btn.disabled = false;
    btn.classList.remove('running');
    btn.textContent = '▶ Run Now';
  }
}

function renderRunResults(results) {
  const el = document.getElementById('runResults');
  if (!results || results.length === 0) {
    el.style.display = 'flex';
    el.innerHTML = '<div class="result-row no_changes"><span class="result-icon">ℹ️</span><span>No projects configured or run complete.</span></div>';
    return;
  }

  const icons = { posted: '✅', no_changes: '💤', first_run: '🔖', error: '❌' };
  const labels = {
    posted: r => `${r.changesCount} change${r.changesCount !== 1 ? 's' : ''} posted to Jira`,
    no_changes: () => 'No changes detected',
    first_run: () => 'First run — baseline saved',
    error: r => r.error || 'Unknown error'
  };

  el.innerHTML = results.map(r => `
    <div class="result-row ${r.status}">
      <span class="result-icon">${icons[r.status] || '•'}</span>
      <div>
        <strong>${esc(r.figmaFileName || r.projectId)}</strong>
        <div class="result-detail">${esc((labels[r.status] || (() => r.status))(r))}</div>
      </div>
    </div>
  `).join('');
  el.style.display = 'flex';
}

/* ── Render settings form ── */
function renderSettings() {
  document.getElementById('jiraBaseUrl').value = config.jiraBaseUrl || '';
  document.getElementById('jiraEmail').value   = config.jiraEmail   || '';
  document.getElementById('schedule').value    = config.schedule    || '0 8 * * *';
  document.getElementById('figmaToken').placeholder   = config.figmaToken   ? '(stored — leave blank to keep)' : 'figd_…';
  document.getElementById('jiraApiToken').placeholder = config.jiraApiToken ? '(stored — leave blank to keep)' : 'Your Jira API token';
  document.getElementById('figmaToken').value   = '';
  document.getElementById('jiraApiToken').value = '';
}

function updateStatusBar() {
  document.getElementById('lastRun').textContent = lastRunTime ? formatDate(lastRunTime) : '—';
  document.getElementById('scheduleDisplay').textContent = config.schedule || '0 8 * * *';
  document.getElementById('nextRun').textContent = describeSchedule(config.schedule || '0 8 * * *');
}

/* ── Render project list ── */
function renderProjects() {
  const list = document.getElementById('projectList');
  const projects = config.projects || [];
  if (projects.length === 0) {
    list.innerHTML = '<div class="empty-state">No projects configured yet. Add one to get started.</div>';
    return;
  }
  list.innerHTML = '';
  for (const p of projects) {
    const mentions = (p.mentionedUsers || []).map(u => u.displayName).join(', ') || '';
    const nameHtml = p.figmaUrl
      ? `<a href="${esc(p.figmaUrl)}" target="_blank" rel="noopener noreferrer" style="color:inherit;">${esc(p.figmaFileName || p.figmaFileKey)}</a>`
      : esc(p.figmaFileName || p.figmaFileKey);
    const card = document.createElement('div');
    card.className = 'project-card';
    card.innerHTML = `
      <div class="project-card-info">
        <div class="name">${nameHtml}</div>
        <div class="meta">Figma: <code>${esc(p.figmaFileKey)}</code> → Jira: <strong>${esc(p.jiraIssueKey)}</strong></div>
        ${mentions ? `<div class="mentions">👥 ${esc(mentions)}</div>` : ''}
      </div>
      <div class="project-card-actions">
        <button class="btn-secondary" onclick="openEditModal('${p.id}')">Edit</button>
        <button class="btn-danger" onclick="deleteProject('${p.id}')">Remove</button>
      </div>`;
    list.appendChild(card);
  }
}

function render() {
  renderSettings();
  renderProjects();
  updateStatusBar();
}

/* ── Settings form submit ── */
document.getElementById('settingsForm').addEventListener('submit', e => {
  e.preventDefault();
  config.jiraBaseUrl = document.getElementById('jiraBaseUrl').value.trim();
  config.jiraEmail   = document.getElementById('jiraEmail').value.trim();
  config.schedule    = document.getElementById('schedule').value.trim() || '0 8 * * *';
  const ft = document.getElementById('figmaToken').value;
  const jt = document.getElementById('jiraApiToken').value;
  if (ft) config.figmaToken   = ft;
  if (jt) config.jiraApiToken = jt;
  saveConfig(config);
  setupScheduleTimer();
  render();
  showAlert('settingsAlert', 'success', 'Settings saved.');
});

/* ── Project delete ── */
function deleteProject(id) {
  if (!confirm('Remove this project?')) return;
  config.projects = (config.projects || []).filter(p => p.id !== id);
  saveConfig(config);
  renderProjects();
}

/* ── Modal open / close ── */
function openAddModal() {
  editingProjectId = null;
  document.getElementById('modalTitle').textContent = 'Add project';
  document.getElementById('modalProjectId').value = uuid();
  document.getElementById('modalFileKey').value   = '';
  document.getElementById('modalFileName').value  = '';
  document.getElementById('modalJiraKey').value   = '';
  renderMentionRows([]);
  document.getElementById('modalAlert').className = 'alert';
  document.getElementById('projectModal').classList.add('open');
}

function openEditModal(id) {
  const p = (config.projects || []).find(p => p.id === id);
  if (!p) return;
  editingProjectId = id;
  document.getElementById('modalTitle').textContent = 'Edit project';
  document.getElementById('modalProjectId').value = p.id;
  document.getElementById('modalFileKey').value   = p.figmaUrl || p.figmaFileKey || '';
  document.getElementById('modalFileName').value  = p.figmaFileName || '';
  document.getElementById('modalJiraKey').value   = p.jiraIssueKey || '';
  renderMentionRows(p.mentionedUsers || []);
  document.getElementById('modalAlert').className = 'alert';
  document.getElementById('projectModal').classList.add('open');
}

function closeModal() {
  document.getElementById('projectModal').classList.remove('open');
}

/* ── Mention rows ── */
function renderMentionRows(users) {
  const c = document.getElementById('mentionRows');
  c.innerHTML = '';
  const list = users.length ? users : [{ displayName: '', jiraAccountId: '' }];
  for (const u of list) addMentionRow(c, u.displayName, u.jiraAccountId);
}

function addMentionRow(container, displayName = '', jiraAccountId = '') {
  const row = document.createElement('div');
  row.className = 'mention-row';
  row.innerHTML = `
    <input type="text" placeholder="Display name" value="${esc(displayName)}" class="mention-name" />
    <input type="text" placeholder="Jira account ID" value="${esc(jiraAccountId)}" class="mention-id" />
    <button type="button" class="btn-danger" title="Remove" style="padding:7px 10px;">✕</button>`;
  row.querySelector('button').addEventListener('click', () => row.remove());
  container.appendChild(row);
}

/* ── Auto-fill display name from Figma URL ── */
document.getElementById('modalFileKey').addEventListener('input', () => {
  const raw = document.getElementById('modalFileKey').value;
  if (!raw.includes('figma.com')) return;
  const { displayName } = parseFigmaInput(raw);
  if (displayName && !document.getElementById('modalFileName').value) {
    document.getElementById('modalFileName').value = displayName;
  }
});

/* ── Save project ── */
document.getElementById('modalSave').addEventListener('click', () => {
  const raw  = document.getElementById('modalFileKey').value.trim();
  const { fileKey, figmaUrl } = parseFigmaInput(raw);
  const fileName  = document.getElementById('modalFileName').value.trim();
  const rawJira   = document.getElementById('modalJiraKey').value.trim();
  const { issueKey } = parseJiraInput(rawJira);

  if (!fileKey || !issueKey) {
    showAlert('modalAlert', 'error', 'Figma URL and Jira ticket are required.');
    return;
  }

  const mentionedUsers = [...document.querySelectorAll('#mentionRows .mention-row')]
    .map(row => ({
      displayName:   row.querySelector('.mention-name').value.trim(),
      jiraAccountId: row.querySelector('.mention-id').value.trim(),
    }))
    .filter(u => u.displayName && u.jiraAccountId);

  const projectId = document.getElementById('modalProjectId').value;
  const newProject = {
    id: projectId,
    figmaFileKey: fileKey,
    figmaUrl: figmaUrl || '',
    figmaFileName: fileName || fileKey,
    jiraIssueKey: issueKey,
    mentionedUsers,
  };

  const projects = [...(config.projects || [])];
  const idx = projects.findIndex(p => p.id === projectId);
  if (idx >= 0) projects[idx] = newProject; else projects.push(newProject);
  config.projects = projects;
  saveConfig(config);
  renderProjects();
  closeModal();
});

/* ── Wire up buttons ── */
document.getElementById('btnRunNow').addEventListener('click', () => executeRun(false));
document.getElementById('btnAddProject').addEventListener('click', openAddModal);
document.getElementById('modalClose').addEventListener('click', closeModal);
document.getElementById('modalCancel').addEventListener('click', closeModal);
document.getElementById('projectModal').addEventListener('click', e => {
  if (e.target === document.getElementById('projectModal')) closeModal();
});
document.getElementById('btnAddMention').addEventListener('click', () => {
  addMentionRow(document.getElementById('mentionRows'));
});

/* ── Init ── */
render();
setupScheduleTimer();
</script>
